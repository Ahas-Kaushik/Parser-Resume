# ========================================
# Nginx config for React SPA (Single Page Application)
# Handles client-side routing and proxies /api to backend
# ========================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # FIX: Proxy /api/* to backend service so VITE_API_BASE_URL isn't needed in production.
    # The frontend calls /api/..., nginx strips /api and forwards to backend container.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FIX: Handle React Router - return index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}